map $uri $genie_cache_control {
    default "no-cache";
    ~^/(assets|vendor)/ "public, max-age=604800";
}

server {
    listen 8080;
    server_name app.sameheart-design.com;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://llqwzrgzekalwdnetvyb.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $genie_cache_control always;

    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /app.js {
        try_files $uri =404;
    }
    location = /auth.js {
        try_files $uri =404;
    }
    location = /sync.js {
        try_files $uri =404;
    }
    location = /leads.js {
        try_files $uri =404;
    }
    location = /config.js {
        try_files $uri =404;
    }
    location = /styles.css {
        try_files $uri =404;
    }
    location ^~ /vendor/ {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
