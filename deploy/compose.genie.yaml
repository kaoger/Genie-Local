name: genie-local

services:
  genie-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ..
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.genie-web.rule: Host(`app.sameheart-design.com`)
      traefik.http.routers.genie-web.entrypoints: websecure
      traefik.http.routers.genie-web.tls: "true"
      traefik.http.routers.genie-web.tls.certresolver: letsencrypt
      traefik.http.services.genie-web.loadbalancer.server.port: "8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: hermes-agent-llsk_default
