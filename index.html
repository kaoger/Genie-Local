<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="三禾">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png">
  <title>Genie-Local</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23cbd3df'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="sync.js" defer></script>
  <script src="leads.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="auth-shell" class="auth-shell" role="status">正在檢查登入狀態…</div>
  <div id="offline-banner" class="offline-banner" hidden><span>尚未重新確認成員（離線）</span><button type="button" data-action="auth-retry">重試</button></div>
  <aside class="sidebar" aria-label="主選單" hidden>
    <button class="avatar" data-action="account" aria-label="本機個人設定" title="本機個人設定"></button>
    <nav class="nav-actions">
      <button class="add-button" data-action="add" aria-label="新增專案" title="新增專案" data-icon="plus"><span class="nav-icon"></span><span class="nav-label">新增</span></button>
      <button data-action="home" aria-label="潛在客戶" title="潛在客戶" data-icon="folder" aria-current="page"><span class="nav-icon"></span><span class="nav-label">潛在客戶</span></button>
      <button data-action="leads" aria-label="客戶名單" title="客戶名單" data-icon="users"><span class="nav-icon"></span><span class="nav-label">客戶名單</span><span id="lead-nav-badge" class="lead-nav-badge" hidden></span><span id="lead-nav-description" class="sr-only"></span></button>
      <button data-action="knowledge" aria-label="知識庫" title="知識庫" data-icon="book"><span class="nav-icon"></span><span class="nav-label">知識庫</span></button>
      <button data-action="account" aria-label="個人設定" title="個人設定" data-icon="user"><span class="nav-icon"></span><span class="nav-label">個人設定</span></button>
      <button data-action="export" aria-label="匯出本機資料" title="匯出本機資料" data-icon="code"><span class="nav-icon"></span><span class="nav-label">匯出本機資料</span></button>
      <button id="more-button" data-action="more" aria-label="更多" title="更多" aria-expanded="false" aria-controls="more-menu" data-icon="more" hidden><span class="nav-icon"></span><span class="nav-label">更多</span></button>
    </nav>
    <div class="sidebar-bottom"><button data-action="signout" aria-label="登出" title="登出">登出</button><button class="help-button" data-action="help" aria-label="使用說明" title="使用說明" data-icon="help"><span class="nav-icon"></span><span class="nav-label">使用說明</span></button></div>
    <div id="more-menu" class="more-menu" role="group" aria-labelledby="more-button" hidden></div>
  </aside>
  <main hidden>
    <p id="storage-warning" class="storage-warning" role="alert" hidden>部分資料無法讀取，請先匯出本機資料。本次開啟暫停儲存，避免覆蓋原始資料。</p>
    <p id="sync-readonly" class="sync-notice" role="status" hidden>此專案已在另一個分頁開啟</p>
    <!-- 潛在客戶清單 -->
    <div id="list-view" hidden>
      <header class="list-header page-header"><h1 tabindex="-1">潛在客戶</h1><div id="home-account"></div></header>
      <section class="content" aria-label="客戶清單">
        <div id="sync-panel" class="sync-panel" aria-label="專案雲端同步"><button id="sync-status" type="button" data-action="sync-retry" role="status">同步中…</button><div id="sync-conflicts"></div><div id="sync-quarantine"></div></div>
        <div class="selection-bar" hidden><span id="selected-count"></span><button data-action="delete-selected">刪除所選</button><button data-action="clear-selection">取消選取</button></div>
        <label class="card-select-all"><input id="card-select-all" type="checkbox">全選本頁</label>
        <div class="table-scroll" role="region" aria-label="客戶資料表，可左右捲動" tabindex="0">
          <table>
            <colgroup><col style="width:3%"><col style="width:12%"><col style="width:6%"><col style="width:8%"><col style="width:9%"><col style="width:12%"><col style="width:9%"><col style="width:8%"><col style="width:8%"><col style="width:17%"><col style="width:8%"></colgroup>
            <thead><tr><th><input id="select-all" type="checkbox" aria-label="全選此頁"></th><th scope="col">名稱</th><th scope="col">聯絡人</th><th scope="col">洽詢日期</th><th scope="col">需求類型</th><th scope="col">電子信箱</th><th scope="col">電話</th><th scope="col">專案到期日</th><th scope="col">需求來源</th><th scope="col">目前步驟</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="project-cards" class="project-cards" aria-label="客戶卡片"></div>
        <p class="card-example"><span class="example-badge">範例</span> 示範品牌 / Demo Brand 是展示排版的範例，不是客戶資料。</p>
        <footer><div class="pagination"><button id="prev" aria-label="上一頁" data-icon="left"></button><span id="pages"></span><button id="next" aria-label="下一頁" data-icon="right"></button></div><span id="count"></span></footer>
      </section>
    </div>
    <!-- 專案內頁（由 app.js 產生內容） -->
    <div id="detail-view" hidden></div>
    <div id="leads-view" hidden></div>
  </main>
  <button id="back-to-top" type="button" aria-label="回到頂部" data-icon="up" hidden></button>

  <!-- 快速新增專案 -->
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="project-form">
      <div class="dialog-heading"><h2 id="editor-title">新增專案</h2><button type="button" data-close aria-label="關閉" data-icon="close"></button></div>
      <div class="form-grid">
        <label class="wide">專案名稱 <input name="name" required maxlength="100" placeholder="例如：王小姐 台中沙鹿 新成屋"></label>
        <label>聯絡人<input name="contact" maxlength="60"></label><label>洽詢日期<input name="date" type="date" required></label>
        <label>需求類型<select name="type"></select></label>
        <label>專案到期日<input name="due" type="date"></label>
        <label>電子信箱<input name="email" type="email" maxlength="150"></label><label>電話<input name="phone" type="tel" maxlength="40" inputmode="tel"></label>
      </div>
      <p class="muted">建立後會直接進入專案，再用「編輯全部資料」一次補齊需求。</p>
      <div class="dialog-footer"><button type="button" data-close>取消</button><button class="primary" type="submit">建立專案</button></div>
    </form>
  </dialog>

  <!-- 一次編輯全部資料的側邊表單 -->
  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
    <form id="drawer-form">
      <div class="drawer-head">
        <div class="drawer-title-wrap"><h2 id="drawer-title">編輯專案資料</h2><div id="drawer-progress" class="progress-line"></div></div>
        <button type="button" data-drawer-close aria-label="關閉" data-icon="close"></button>
      </div>
      <p id="drawer-cloud-note" class="sync-notice" role="status" hidden>另一台已更新這個專案</p>
      <nav class="drawer-tabs" id="drawer-tabs" aria-label="表單區塊"></nav>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-foot">
        <span id="dirty-note" class="dirty-note" aria-live="polite"></span>
        <button type="button" data-drawer-close>取消</button>
        <button class="primary" type="submit">儲存變更</button>
      </div>
    </form>
  </dialog>

  <dialog id="discard-dialog" aria-labelledby="discard-title"><div class="dialog-heading"><h2 id="discard-title">還沒儲存</h2></div><p>剛才的修改尚未儲存，確定要關閉嗎？</p><div class="dialog-footer"><button id="discard-confirm">放棄變更</button><button class="primary" id="discard-cancel">繼續編輯</button></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-heading"><h2 id="confirm-title">刪除專案</h2><button data-close aria-label="關閉" data-icon="close"></button></div><p id="confirm-copy"></p><p class="muted">刪除後可從畫面下方的提示復原。</p><div class="dialog-footer"><button data-close>取消</button><button class="danger" id="confirm-delete">刪除</button></div></dialog>
  <dialog id="info-dialog" aria-labelledby="info-title"><div class="dialog-heading"><h2 id="info-title"></h2><button data-close aria-label="關閉" data-icon="close"></button></div><div id="info-body"></div></dialog>
  <dialog id="signout-dialog" aria-labelledby="signout-title"><div class="dialog-heading"><h2 id="signout-title">還有資料沒上傳</h2></div><p id="signout-copy"></p><div class="dialog-footer"><button type="button" data-close>取消</button><button type="button" data-action="export-signout">匯出後登出</button></div></dialog>
  <div id="toast" role="status" hidden><span id="toast-text"></span><button id="toast-action" hidden></button><button aria-label="關閉通知" id="dismiss-toast" data-icon="close"></button></div>
</body>
</html>
